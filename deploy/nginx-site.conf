server {
    server_name fileforge.cn www.fileforge.cn;

    client_max_body_size 500m;

    # High-latency connection tuning (for mainland China users)
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 300s;
    keepalive_requests 1000;
    reset_timedout_connection on;
    client_body_timeout 600s;
    client_header_timeout 60s;
    
    # Larger buffers for slow connections
    proxy_buffer_size 256k;
    proxy_buffers 16 256k;
    proxy_busy_buffers_size 1m;
    output_buffers 4 512k;
    
    # Gzip tuning for slower connections
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/rss+xml text/javascript image/svg+xml application/x-font-ttf font/ttf font/otf image/x-icon;
    gzip_vary on;
    gzip_proxied any;


    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/fileforge.cn/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;


    location / {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /convert/progress/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    location /convert {
        limit_req zone=convert_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_request_buffering off;
        client_max_body_size 500m;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }

    location /download/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location /xfile/ {
        internal;
        alias /tmp/fileforge_downloads/;
        directio 1m;
        output_buffers 4 1m;
        tcp_nopush on;
        sendfile on;
        sendfile_max_chunk 2m;
        aio threads;
        aio_write on;
        access_log off;
    }

    location /static/ {
        alias /home/ubuntu/FileForge/static/;
        expires 90d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/fileforge.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fileforge.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name fileforge.cn www.fileforge.cn;
    return 301 https://$host$request_uri;
}


