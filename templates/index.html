<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<link rel="dns-prefetch" href="//fileforge.cn">
<link rel="preconnect" href="//fileforge.cn" crossorigin>
<link rel="preload" as="image" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22/>" fetchpriority="high">
<title>FileForge - 文件转换工坊</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 30%,#16213e 60%,#0f0f1a 100%);min-height:100vh;color:#e0e0e0;position:relative;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 0%,rgba(100,130,255,0.08) 0%,transparent 60%);pointer-events:none;z-index:0}
#rain-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.6}
.container{max-width:1100px;margin:0 auto;padding:20px;position:relative;z-index:2}
header{text-align:center;padding:30px 0 20px}
header h1{font-size:2.4em;font-weight:700;background:linear-gradient(135deg,#a0c4ff,#c4b5fd,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
header p{color:#888;font-size:0.95em}

.controls-bar{display:flex;justify-content:center;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:rgba(255,255,255,0.04);border-radius:16px;margin-bottom:24px;backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.06)}
.ctrl-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#ccc;cursor:pointer;font-size:0.85em;transition:all 0.3s;white-space:nowrap}
.ctrl-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.25)}
.ctrl-btn.active{background:rgba(130,160,255,0.2);border-color:rgba(130,160,255,0.5);color:#b0c8ff}
.ctrl-btn .icon{font-size:1.1em}
.volume-slider{width:80px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.2);border-radius:2px;outline:none;cursor:pointer}
.volume-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#a0c4ff;cursor:pointer}
.ctrl-select{padding:6px 10px;border-radius:12px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#ccc;font-size:0.8em;cursor:pointer}

.batch-top-btn{border-color:rgba(160,200,255,0.25);background:rgba(130,160,255,0.08);color:#b0c8ff}.batch-top-btn:hover{background:rgba(130,160,255,0.18);border-color:rgba(160,200,255,0.5);color:#fff}

.cat-tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:20px}
.cat-tab{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.03);color:#999;cursor:pointer;font-size:0.85em;transition:all 0.3s}
.cat-tab:hover{background:rgba(255,255,255,0.08);color:#ccc}
.cat-tab.active{background:rgba(130,160,255,0.2);border-color:rgba(130,160,255,0.4);color:#a0c4ff}

.conv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:28px}
.conv-card{padding:16px;border-radius:14px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.3s;position:relative}
.conv-card:hover{background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.18);transform:translateY(-2px)}
.conv-card.selected{background:rgba(130,160,255,0.15);border-color:rgba(130,160,255,0.5);box-shadow:0 0 20px rgba(100,130,255,0.15)}
.conv-card .conv-icon{font-size:1.5em;margin-bottom:6px}
.conv-card .conv-label{font-weight:600;font-size:0.95em;margin-bottom:2px}
.conv-card .conv-hint{font-size:0.75em;color:#777}
.conv-card .conv-ext{font-size:0.7em;color:#555;margin-top:4px}

.upload-zone{border:2px dashed rgba(255,255,255,0.15);border-radius:20px;padding:50px 20px;text-align:center;cursor:pointer;transition:all 0.3s;background:rgba(255,255,255,0.02);margin-bottom:16px}
.upload-zone:hover,.upload-zone.drag-over{border-color:rgba(130,160,255,0.5);background:rgba(130,160,255,0.06)}
.upload-zone .upload-icon{font-size:3em;margin-bottom:10px}
.upload-zone .upload-text{font-size:1.1em;color:#aaa;margin-bottom:6px}
.upload-zone .upload-sub{font-size:0.8em;color:#666}
.upload-zone.has-file{border-color:rgba(100,220,150,0.4);background:rgba(100,220,150,0.05)}
#file-name{font-size:0.9em;color:#8be0a0;margin-top:8px;word-break:break-all}
#file-input{display:none}

.batch-link{display:block;text-align:center;padding:12px;margin-top:10px;border-radius:14px;border:1px solid rgba(160,200,255,0.25);background:rgba(130,160,255,0.08);color:#b0c8ff;text-decoration:none;font-size:0.95em;font-weight:600;transition:all 0.3s;letter-spacing:0.5px}.batch-link:hover{border-color:rgba(160,200,255,0.5);background:rgba(130,160,255,0.18);color:#fff;transform:translateY(-1px);box-shadow:0 4px 15px rgba(100,130,255,0.15)}.batch-link.unlocked.sponsor-btn{border-color:rgba(255,180,130,0.3);background:rgba(255,150,100,0.08);color:#ffb088}.sponsor-btn:hover{background:rgba(255,150,100,0.18);border-color:rgba(255,180,130,0.5)}{border-color:rgba(160,220,255,0.5);background:rgba(130,200,255,0.15);color:#d0e0ff;box-shadow:0 2px 10px rgba(100,160,255,0.1)}
.progress-section{display:none;margin-bottom:16px}
.progress-section.active{display:block}
.progress-bar-wrap{background:rgba(255,255,255,0.06);border-radius:10px;height:20px;overflow:hidden;margin-bottom:8px;position:relative}
.progress-bar{will-change:width;height:100%;background:linear-gradient(90deg,#4a6cf7,#7b8cff,#a78bfa);border-radius:10px;width:0%;position:relative;transition:width 0.3s}
.progress-bar::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.progress-info{display:flex;justify-content:space-between;font-size:0.8em;color:#999}
.progress-percent{font-weight:700;color:#a0c4ff}
.progress-eta{color:#888}

.danmaku-area{position:fixed;bottom:60px;left:0;width:100%;pointer-events:none;z-index:10;overflow:hidden;height:40px}
.danmaku-text{position:absolute;white-space:nowrap;color:rgba(200,210,255,0.7);font-size:0.9em;animation:danmaku-scroll 8s linear forwards;font-style:italic}
@keyframes danmaku-scroll{0%{left:100%;opacity:1}70%{opacity:1}100%{left:-100%;opacity:0}}

.download-btn{display:none;margin:16px auto;padding:18px 50px;border-radius:16px;border:2px solid rgba(34,197,94,0.5);background:linear-gradient(135deg,#22c55e,#10b981);color:#fff;font-size:1.2em;font-weight:700;cursor:pointer;transition:all 0.3s;text-decoration:none;box-shadow:0 4px 20px rgba(34,197,94,0.3);animation:pulse-btn 2s infinite}.download-btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 8px 35px rgba(34,197,94,0.5);border-color:rgba(34,197,94,0.8)}.download-btn.show{display:inline-block}@keyframes pulse-btn{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,0.3)}50%{box-shadow:0 4px 35px rgba(34,197,94,0.6)}}.cancel-btn{display:none;margin:0 auto 10px;padding:8px 24px;border-radius:20px;border:1px solid rgba(255,100,100,0.4);background:rgba(255,80,80,0.1);color:#f88;cursor:pointer;font-size:0.85em;transition:all 0.3s}.cancel-btn:hover{background:rgba(255,80,80,0.25)}.cancel-btn.active{display:block}

.convert-btn{display:none;margin:0 auto;padding:12px 40px;border-radius:24px;border:none;background:linear-gradient(135deg,#4a6cf7,#7b4df4);color:white;font-size:1em;font-weight:600;cursor:pointer;transition:all 0.3s;box-shadow:0 4px 15px rgba(74,108,247,0.3)}
.convert-btn:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(74,108,247,0.4)}
.convert-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.convert-btn.active{display:block}

.error-msg{display:none;text-align:center;color:#f88;padding:10px;background:rgba(255,80,80,0.08);border-radius:10px;margin-top:10px;font-size:0.85em}
.error-msg.active{display:block}

.auth-hint{display:none;text-align:center;padding:10px;background:rgba(255,200,80,0.08);border-radius:10px;margin-top:10px;font-size:0.85em;color:#fc8}
.auth-hint.active{display:block}
.auth-link{color:#a0c4ff;cursor:pointer;text-decoration:underline}

@media(max-width:600px){
header h1{font-size:1.6em}
.controls-bar{gap:8px;padding:10px}
.conv-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
}


@media (max-width:768px){}

</style>
</head>
<body>
<canvas id="rain-canvas"></canvas>
<div class="container">
<header><h1>⚒ FileForge</h1><p>万能文件转换工坊 · 安全 · 快速 · 隐私无忧</p></header>

<div class="controls-bar" id="controls-bar">
<button class="ctrl-btn active" id="rain-btn" onclick="toggleRain()"><span class="icon">🌧</span> 雨声<span id="rain-status">开</span></button>
<button class="ctrl-btn active" id="music-btn" onclick="toggleMusic()"><span class="icon">🎵</span> 音乐<span id="music-status">开</span></button>
<input type="range" class="volume-slider" id="music-volume" min="0" max="100" value="40" oninput="setMusicVolume(this.value)" title="音乐音量">
<select class="ctrl-select" id="playlist-select" onchange="switchTrack(this.value)">
<option value="summer_ghost">Summer Ghost</option>
<option value="departures">Departures</option>
<option value="karuta">Karuta</option>
</select>
<button class="ctrl-btn" id="music-play-btn" onclick="toggleMusicPlay()"><span class="icon" id="music-play-icon">⏸</span></button>

<a href="/batch" class="ctrl-btn batch-top-btn">📦 批量转换</a>
<a href="https://ifdian.net/a/Fecilia" target="_blank" class="ctrl-btn sponsor-btn">❤️ 赞助</a>
</div>

<div class="cat-tabs" id="cat-tabs"></div>
<div class="conv-grid" id="conv-grid"></div>

<div class="upload-zone" id="upload-zone">
<div class="upload-icon">📁</div>
<div class="upload-text">点击或拖拽文件到这里</div>
<div class="upload-sub">最大 500MB</div>
<div id="file-name"></div>
</div>
<input type="file" id="file-input">


<div class="progress-section" id="progress-section">
<div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
<div class="progress-info"><span class="progress-percent" id="progress-percent">0%</span><span class="progress-eta" id="progress-eta"></span></div>
</div>
<div class="danmaku-area" id="danmaku-area"></div>

<button class="cancel-btn" id="cancel-btn">✕ 取消上传</button>
<a class="download-btn" id="download-btn" target="_blank">⬇ 点击下载文件</a>
<button class="convert-btn" id="convert-btn">开始转换</button>
<a href="/batch" class="batch-link" id="batch-link">📦 批量转换</a>
<div style="text-align:center;margin-top:16px;padding-bottom:20px"><a href="https://ifdian.net/a/Fecilia" target="_blank" style="color:#888;text-decoration:none;font-size:0.85em;transition:color 0.3s" onmouseover="this.style.color="#ffb088"" onmouseout="this.style.color="#888"">❤️ 觉得好用？赞助作者 → 爱发电</a></div>
<div class="error-msg" id="error-msg"></div>
<div class="auth-hint" id="auth-hint">⚠ 转换需要认证。<a class="auth-link" href="/convert" target="_blank">点此完成认证</a>后重试。</div>
</div>

<script>
var CONVERSIONS = {{ conversions | tojson }};
var selectedConv = null, selectedFile = null, currentXHR = null, currentTaskId = null;
var progressPollInterval = null, rainOn = true, musicOn = true, musicPlaying = true;
var rainAudioCtx = null, rainGain = null, rainAniId = null, lastBarPct = 0;

// ===== MUSIC =====
var musicAudio = new Audio("/static/summer_ghost.mp3");
musicAudio.loop = true; musicAudio.volume = 0.4;
var playlist = {summer_ghost:"/static/summer_ghost.mp3", departures:"/static/departures.mp3", karuta:"/static/karuta.mp3"};
function toggleMusic(){musicOn=!musicOn;var b=document.getElementById("music-btn"),s=document.getElementById("music-status");if(musicOn){b.classList.add("active");s.textContent="开";if(musicPlaying)musicAudio.play().catch(function(){})}else{b.classList.remove("active");s.textContent="关";musicAudio.pause()}}
function toggleMusicPlay(){musicPlaying=!musicPlaying;var i=document.getElementById("music-play-icon");if(musicPlaying){i.textContent="⏸";if(musicOn)musicAudio.play().catch(function(){})}else{i.textContent="▶";musicAudio.pause()}}
function setMusicVolume(v){musicAudio.volume=v/100}
function switchTrack(k){var w=!musicAudio.paused;musicAudio.src=playlist[k];musicAudio.load();if(w&&musicOn){musicAudio.play().catch(function(){});musicPlaying=true;document.getElementById("music-play-icon").textContent="⏸"}}

// ===== RAIN =====
var rainCanvas=document.getElementById("rain-canvas"),rainCtx=rainCanvas.getContext("2d"),raindrops=[];
function resizeRain(){rainCanvas.width=window.innerWidth;rainCanvas.height=window.innerHeight}
window.addEventListener("resize",resizeRain);resizeRain();
function createRainAudio(){if(rainAudioCtx)return;try{rainAudioCtx=new (window.AudioContext||window.webkitAudioContext)();rainGain=rainAudioCtx.createGain();rainGain.gain.value=0.08;rainGain.connect(rainAudioCtx.destination);var n=rainAudioCtx.createScriptProcessor(4096,1,1);n.onaudioprocess=function(e){var o=e.outputBuffer.getChannelData(0);for(var i=0;i<4096;i++)o[i]=(Math.random()*2-1)*0.3};n.connect(rainGain)}catch(e){}}
function startRain(){if(!rainAudioCtx)createRainAudio();if(rainAudioCtx&&rainAudioCtx.state==="suspended")rainAudioCtx.resume().catch(function(){});rainOn=true;document.getElementById("rain-btn").classList.add("active");document.getElementById("rain-status").textContent="开";initRaindrops();animateRain()}
function stopRain(){rainOn=false;document.getElementById("rain-btn").classList.remove("active");document.getElementById("rain-status").textContent="关";if(rainAniId){cancelAnimationFrame(rainAniId);rainAniId=null}if(rainAudioCtx&&rainAudioCtx.state==="running")rainAudioCtx.suspend().catch(function(){})}
function toggleRain(){if(rainOn)stopRain();else startRain()}
function initRaindrops(){raindrops=[];for(var i=0;i<200;i++)raindrops.push({x:Math.random()*rainCanvas.width,y:Math.random()*rainCanvas.height,speed:8+Math.random()*14,len:8+Math.random()*16,opacity:0.15+Math.random()*0.35})}
function animateRain(){if(!rainOn)return;rainCtx.clearRect(0,0,rainCanvas.width,rainCanvas.height);for(var i=0;i<raindrops.length;i++){var d=raindrops[i];d.y+=d.speed;if(d.y>rainCanvas.height){d.y=-d.len;d.x=Math.random()*rainCanvas.width}rainCtx.beginPath();rainCtx.moveTo(d.x,d.y);rainCtx.lineTo(d.x-1,d.y+d.len);rainCtx.strokeStyle="rgba(180,200,255,"+d.opacity+")";rainCtx.lineWidth=1;rainCtx.stroke()}rainAniId=requestAnimationFrame(animateRain)}

// ===== UI =====
function buildUI(){
var t=document.getElementById("cat-tabs");
t.innerHTML='<button class="cat-tab active" data-cat="all">全部</button>';
var cats={doc:"📄 文档",img:"🖼 图片",audio:"🎵 音频",video:"🎬 视频",sheet:"📊 表格"};
for(var k in cats)t.innerHTML+='<button class="cat-tab" data-cat="'+k+'">'+cats[k]+'</button>';
var g=document.getElementById("conv-grid");
for(var key in CONVERSIONS){var c=CONVERSIONS[key];g.innerHTML+='<div class="conv-card" data-cat="'+c.cat+'" data-key="'+key+'"><div class="conv-icon">'+c.icon+'</div><div class="conv-label">'+c.label+'</div><div class="conv-hint">'+c.hint+'</div><div class="conv-ext">输入: '+c.in+'</div></div>'}
document.getElementById("cat-tabs").addEventListener("click",function(e){if(e.target.classList.contains("cat-tab")){document.querySelectorAll(".cat-tab").forEach(function(t){t.classList.remove("active")});e.target.classList.add("active");var cat=e.target.dataset.cat;document.querySelectorAll(".conv-card").forEach(function(c){c.style.display=(cat==="all"||c.dataset.cat===cat)?"":"none"})}});
document.getElementById("conv-grid").addEventListener("click",function(e){var c=e.target.closest(".conv-card");if(!c)return;selectedConv=c.dataset.key;document.querySelectorAll(".conv-card").forEach(function(x){x.classList.remove("selected")});c.classList.add("selected");updateConvertBtn()});
document.getElementById("upload-zone").addEventListener("click",function(){document.getElementById("file-input").click()});
document.getElementById("cancel-btn").addEventListener("click",function(){if(currentXHR){currentXHR.abort();currentXHR=null}if(progressPollInterval){clearInterval(progressPollInterval);progressPollInterval=null}resetUI()});
}
buildUI();

// ===== FILE =====
var uploadZone=document.getElementById("upload-zone");
uploadZone.addEventListener("dragover",function(e){e.preventDefault();uploadZone.classList.add("drag-over")});
uploadZone.addEventListener("dragleave",function(){uploadZone.classList.remove("drag-over")});
uploadZone.addEventListener("drop",function(e){e.preventDefault();uploadZone.classList.remove("drag-over");if(e.dataTransfer.files.length){selectedFile=e.dataTransfer.files[0];showFile()}});
document.getElementById("file-input").addEventListener("change",function(){if(this.files.length){selectedFile=this.files[0];showFile()}});
function showFile(){document.getElementById("file-name").textContent="📎 "+selectedFile.name+" ("+formatSize(selectedFile.size)+")";uploadZone.classList.add("has-file");updateConvertBtn()}
function formatSize(b){if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";if(b<1073741824)return(b/1048576).toFixed(1)+" MB";return(b/1073741824).toFixed(2)+" GB"}
function updateConvertBtn(){var b=document.getElementById("convert-btn");if(selectedConv&&selectedFile){b.classList.add("active");b.disabled=false}else{b.classList.remove("active");b.disabled=true}}

// ===== AUTH PRE-FLIGHT =====
function ensureAuth(cb){var h=document.getElementById("auth-hint");h.classList.remove("active");var x=new XMLHttpRequest();x.open("HEAD","/convert");x.timeout=5000;x.onload=function(){if(x.status===401)h.classList.add("active");else{h.classList.remove("active");cb()}};x.onerror=function(){cb()};x.ontimeout=function(){cb()};x.send()}

// ===== CONVERSION (XHR upload + JSON response + redirect download) =====
document.getElementById("convert-btn").addEventListener("click",function(){
if(!selectedConv||!selectedFile)return;
document.getElementById("error-msg").classList.remove("active");document.getElementById("error-msg").textContent="";
document.getElementById("auth-hint").classList.remove("active");
ensureAuth(doConvert);
});

function doConvert(){
var fd=new FormData();fd.append("file",selectedFile);fd.append("type",selectedConv);
currentTaskId="t"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
fd.append("task_id",currentTaskId);
var ps=document.getElementById("progress-section");ps.classList.add("active");lastBarPct=0;updateBar(0);document.getElementById("download-btn").classList.remove("show");document.getElementById("download-btn").classList.remove("show");
document.getElementById("progress-percent").textContent="0%";
document.getElementById("progress-eta").textContent="准备上传...";
document.getElementById("cancel-btn").classList.add("active");
document.getElementById("convert-btn").disabled=true;

var xhr=new XMLHttpRequest();currentXHR=xhr;
var uploadStart=Date.now(),totalSize=selectedFile.size;

xhr.upload.onprogress=function(e){if(!e.lengthComputable)return;var n=Date.now(),el=(n-uploadStart)/1000,sp=el>0?e.loaded/el:0,eta=sp>0?(totalSize-e.loaded)/sp:0,up=Math.round((e.loaded/totalSize)*50);updateBar(up);document.getElementById("progress-percent").textContent=up+"%";if(eta>0&&eta<3600)document.getElementById("progress-eta").textContent="预计剩余 "+formatETA(eta)+" · "+formatSpeed(sp)};
xhr.upload.onloadend=function(){if(!currentXHR)return;updateBar(50);document.getElementById("progress-percent").textContent="50%";document.getElementById("progress-eta").textContent="处理中...";startProgressPoll()};

xhr.onload=function(){
currentXHR=null;
if(progressPollInterval){clearInterval(progressPollInterval);progressPollInterval=null}
if(xhr.status===200){
try{var resp=JSON.parse(xhr.responseText);if(resp.ok){updateBar(100);document.getElementById("progress-percent").textContent="100%";document.getElementById("progress-eta").textContent="✅ 完成！👇️ 点击下方绿色按钮下载";document.getElementById("cancel-btn").classList.remove("active");spawnDanmaku("下载开始！🎉");
// Download by navigating to the URL
var dlUrl=resp.download;var dlBtn=document.getElementById("download-btn");dlBtn.href=dlUrl;dlBtn.classList.add("show");dlBtn.scrollIntoView({behavior:"smooth",block:"center"});document.getElementById("cancel-btn").classList.remove("active");return}}
catch(e){}
// If JSON parse fails, try as blob (old format fallback)
try{var blob=xhr.response;var url=URL.createObjectURL(blob);var a=document.createElement("a");a.href=url;a.download="converted_file";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);setTimeout(resetUI,2000)}catch(e2){handleError("下载失败")}
}else if(xhr.status===401){handleError("认证失败");document.getElementById("auth-hint").classList.add("active")}
else if(xhr.status===429)handleError("请求过于频繁");
else handleError("服务器错误: "+xhr.status)
};
xhr.onerror=function(){if(!currentXHR)return;if(xhr.status===0){handleError("网络错误 - 可能需要认证");document.getElementById("auth-hint").classList.add("active")}else handleError("网络错误")};
xhr.onabort=function(){if(progressPollInterval){clearInterval(progressPollInterval);progressPollInterval=null}resetUI()};
xhr.ontimeout=function(){handleError("转换超时")};
xhr.open("POST","/convert");xhr.timeout=300000;xhr.send(fd);
}

function startProgressPoll(){if(!currentTaskId)return;progressPollInterval=setInterval(function(){if(!currentTaskId){clearInterval(progressPollInterval);progressPollInterval=null;return}fetch("/convert/progress/"+currentTaskId).then(function(r){return r.json()}).then(function(d){if(d.percent<0)return;if(d.percent>=100){clearInterval(progressPollInterval);progressPollInterval=null;updateBar(100);document.getElementById("progress-percent").textContent="100%";document.getElementById("progress-eta").textContent="✅ 完成！👇️ 点击下方绿色按钮下载";return}var p=50+Math.round(d.percent*0.5);updateBar(p);document.getElementById("progress-percent").textContent=p+"%";document.getElementById("progress-eta").textContent=d.message||"转换中...";if(Math.random()<0.12)spawnDanmaku(d.message)}).catch(function(){})},200)}

function updateBar(p){if(p>lastBarPct){lastBarPct=p;document.getElementById("progress-bar").style.width=p+"%"}}

var danmakuMessages=["马上就好了喵~ 🐱","正在努力转换中... ✨","喝杯茶等一下 ☕","快了快了~ 🏃💨","质量第一，稍安勿躁 💎","您的文件正在被精心处理 🎨","马上出炉啦 🔥","再等一下下就好~ 🌸","转换大师工作中... 🧙","好快！快了！⏩","文件在变魔法中 🪄","唔...这个文件有点东西 🤔"];
function spawnDanmaku(msg){var a=document.getElementById("danmaku-area"),e=document.createElement("div");e.className="danmaku-text";e.textContent=msg||danmakuMessages[Math.floor(Math.random()*danmakuMessages.length)];e.style.top=Math.floor(Math.random()*28)+"px";e.style.animationDuration=(6+Math.random()*5)+"s";a.appendChild(e);setTimeout(function(){e.remove()},12000)}
function formatETA(s){if(s<60)return Math.round(s)+"秒";if(s<3600)return Math.round(s/60)+"分"+Math.round(s%60)+"秒";return Math.round(s/3600)+"时"+Math.round((s%3600)/60)+"分"}
function formatSpeed(b){if(b<1024)return Math.round(b)+" B/s";if(b<1048576)return(b/1024).toFixed(1)+" KB/s";return(b/1048576).toFixed(1)+" MB/s"}
function handleError(m){document.getElementById("error-msg").textContent=m;document.getElementById("error-msg").classList.add("active");if(progressPollInterval){clearInterval(progressPollInterval);progressPollInterval=null}resetUI()}
function resetUI(){currentXHR=null;currentTaskId=null;lastBarPct=0;document.getElementById("progress-section").classList.remove("active");document.getElementById("progress-bar").style.width="0%";document.getElementById("progress-percent").textContent="0%";document.getElementById("progress-eta").textContent="";document.getElementById("cancel-btn").classList.remove("active");document.getElementById("download-btn").classList.remove("show");document.getElementById("convert-btn").disabled=false}

// ===== INIT =====

var _navigating = false;
document.addEventListener("click", function(e){
  var a = e.target.closest("a");
  if(a && a.href && !a.href.startsWith("javascript") && !a.target && a.host === location.host && !a.href.includes("#")){
    e.preventDefault();
    if(_navigating) return;
    _navigating = true;
    if(musicAudio && !musicAudio.paused){
      var vol = musicAudio.volume;
      var fade = setInterval(function(){
        vol = Math.max(0, vol - 0.05);
        musicAudio.volume = vol;
        if(vol <= 0){ clearInterval(fade); }
      }, 30);
      // Save state
      localStorage.setItem("ff_music_track", musicAudio.src.split("/").pop().replace(".mp3",""));
      localStorage.setItem("ff_music_time", musicAudio.currentTime + 0.3);
      localStorage.setItem("ff_music_playing", "1");
      setTimeout(function(){ window.location = a.href; }, 250);
    } else {
      localStorage.setItem("ff_music_playing", "0");
      window.location = a.href;
    }
  }
});
(function(){
  var savedTrack = localStorage.getItem("ff_music_track");
  var savedTime = parseFloat(localStorage.getItem("ff_music_time")) || 0;
  var wasPlaying = localStorage.getItem("ff_music_playing") === "1";
  if(savedTrack && wasPlaying && musicAudio && musicOn){
    musicAudio.src = "/static/" + savedTrack + ".mp3";
    musicAudio.currentTime = savedTime;
    musicAudio.volume = 0;
    musicAudio.play().catch(function(){});
    var vol = 0;
    var fadeIn = setInterval(function(){
      vol = Math.min(0.4, vol + 0.04);
      musicAudio.volume = vol;
      if(vol >= 0.4){ clearInterval(fadeIn); }
    }, 30);
  }
})();


function checkBatchUnlock(){var d=localStorage.getItem("ff_batch_unlock");if(!d)return;var u=JSON.parse(d);var unlocked=u.permanent||u.expiry===-1||Date.now()<u.expiry;var el=document.getElementById("batch-link");var sb=document.getElementById("sidebar");if(unlocked){el.textContent="📦 批量转换";el.classList.add("unlocked");var el2=document.querySelector(".batch-top-btn");if(el2){el2.textContent="📦 批量转换";el2.style.borderColor="rgba(140,210,255,0.5)";el2.style.background="rgba(120,190,255,0.15)";el2.style.color="#c8e0ff"}}}
checkBatchUnlock();

var _audioStarted = false;
function tryStartAudio(){
  if(_audioStarted) return;
  _audioStarted = true;
  if(rainOn && !rainAudioCtx) startRain();
  if(musicOn && musicPlaying){
    musicAudio.play().catch(function(){
      _audioStarted = false;
    });
  }
}

  tryStartAudio();
});
document.addEventListener("click", tryStartAudio, {once: true});
