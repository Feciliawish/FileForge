<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FileForge - 批量转换</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 30%,#16213e 60%,#0f0f1a 100%);min-height:100vh;color:#e0e0e0;overflow-x:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background:radial-gradient(ellipse at 50% 0%,rgba(100,130,255,0.08) 0%,transparent 60%);pointer-events:none;z-index:0}
#rain-canvas{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.6}
.container{max-width:900px;margin:0 auto;padding:20px;position:relative;z-index:2}
.audio-bar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 16px;margin-bottom:16px;background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.05)}
.audio-bar button{padding:6px 14px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#aaa;cursor:pointer;font-size:0.82em;transition:all 0.3s}
.audio-bar button:hover{background:rgba(255,255,255,0.08);color:#ccc}
.audio-bar button.active{background:rgba(130,160,255,0.2);border-color:rgba(130,160,255,0.4);color:#b0c8ff}
.upload-zone{border:2px dashed rgba(255,255,255,0.15);border-radius:20px;padding:40px 20px;text-align:center;cursor:pointer;transition:all 0.3s;background:rgba(255,255,255,0.02);margin-bottom:16px}
.upload-zone:hover,.upload-zone.drag-over{border-color:rgba(130,160,255,0.5);background:rgba(130,160,255,0.06)}
.upload-zone .icon{font-size:3em;margin-bottom:10px}
.upload-zone .text{font-size:1.1em;color:#aaa;margin-bottom:6px}
.upload-zone .sub{font-size:0.8em;color:#666}
#file-input{display:none}
.batch-settings{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;background:rgba(255,255,255,0.04);border-radius:12px;border:1px solid rgba(255,255,255,0.06)}
.batch-settings label{font-size:0.85em;color:#888;white-space:nowrap}
.batch-settings select{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#ccc;font-size:0.85em;cursor:pointer}
.batch-settings button{padding:8px 16px;border-radius:10px;border:none;background:rgba(130,160,255,0.2);color:#a0c4ff;cursor:pointer;font-size:0.85em;transition:all 0.3s}
.batch-settings button:hover{background:rgba(130,160,255,0.35)}
.file-list{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.file-item{display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:12px;transition:all 0.3s}
.file-item:hover{border-color:rgba(255,255,255,0.15)}
.file-item .fname{flex:1;font-size:0.9em;word-break:break-all;min-width:0}
.file-item .fsize{font-size:0.75em;color:#666;white-space:nowrap}
.file-item select{padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.06);color:#ccc;font-size:0.8em;cursor:pointer}
.file-item .remove-btn{background:none;border:none;color:#666;cursor:pointer;font-size:1.2em;padding:0 4px;transition:color 0.3s}
.file-item .remove-btn:hover{color:#f87171}
.file-item .status{font-size:0.75em;white-space:nowrap;min-width:60px;text-align:right}
.file-item .status.done{color:#8be0a0}
.file-item .status.error{color:#f87171}
.file-item .status.processing{color:#fbbf24}
.progress-section{display:none;margin-bottom:16px}
.progress-section.active{display:block}
.progress-bar-wrap{background:rgba(255,255,255,0.06);border-radius:10px;height:20px;overflow:hidden;margin-bottom:8px;position:relative}
.progress-bar{will-change:width;height:100%;background:linear-gradient(90deg,#4a6cf7,#7b8cff,#a78bfa);border-radius:10px;width:0%;position:relative;transition:width 0.3s}
.progress-bar::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);animation:shimmer 1.5s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.progress-percent{font-weight:700;color:#a0c4ff}
.progress-eta{color:#888;margin-left:12px}
.danmaku-area{position:fixed;bottom:60px;left:0;width:100%;pointer-events:none;z-index:10;overflow:hidden;height:40px}
.danmaku-text{position:absolute;white-space:nowrap;color:rgba(200,210,255,0.7);font-size:0.9em;animation:danmaku-scroll 8s linear forwards;font-style:italic}
@keyframes danmaku-scroll{0%{left:100%;opacity:1}70%{opacity:1}100%{left:-100%;opacity:0}}
@keyframes pulse-btn{0%,100%{box-shadow:0 4px 20px rgba(34,197,94,0.3)}50%{box-shadow:0 4px 35px rgba(34,197,94,0.6)}}.cancel-btn{display:none;margin:0 auto 10px;padding:8px 24px;border-radius:20px;border:1px solid rgba(255,100,100,0.4);background:rgba(255,80,80,0.1);color:#f88;cursor:pointer;font-size:0.85em;transition:all 0.3s}
.cancel-btn:hover{background:rgba(255,80,80,0.25)}
.cancel-btn.active{display:block}

.convert-btn{display:block;width:100%;padding:14px;border-radius:14px;border:none;background:linear-gradient(135deg,#4a6cf7,#a78bfa);color:#fff;font-size:1.1em;font-weight:600;cursor:pointer;transition:all 0.3s;margin-bottom:8px}
.convert-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(100,130,255,0.3)}
.convert-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}


.back-link{display:inline-block;margin-bottom:16px;color:#888;text-decoration:none;font-size:0.85em;transition:color 0.3s}
.back-link:hover{color:#ccc}
header{text-align:center;padding:20px 0}
header h1{font-size:2em;font-weight:700;background:linear-gradient(135deg,#a0c4ff,#c4b5fd,#f0abfc);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.card{content-visibility:auto;contain-intrinsic-size:500px}
</style>
</head>
<body>
<canvas id="rain-canvas"></canvas>
<audio id="rain-audio" loop preload="auto"></audio>
<audio id="music-audio" preload="auto">
<source src="/static/summer_ghost.mp3" type="audio/mpeg">
</audio>
<div class="container">
<a href="/" class="back-link">← 返回工坊</a>
<div class="audio-bar">
<button class="active" id="sub-rain-btn" onclick="toggleRain()">🌧 雨声 开</button>
<button class="active" id="sub-music-btn" onclick="toggleMusic()">🎵 音乐 开</button>
<button id="sub-play-btn" onclick="toggleMusicPlay()">⏸</button>
<input type="range" style="width:80px" min="0" max="100" value="40" oninput="setMusicVolume(this.value)">
<select style="padding:4px 8px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.06);color:#ccc;font-size:0.78em" onchange="switchTrack(this.value)">
<option value="summer_ghost">Summer Ghost</option>
<option value="departures">Departures</option>
<option value="karuta">Karuta</option>
</select>
</div>
<header><h1>批量转换</h1></header>

<div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
<div class="icon">📂</div><div class="text">点击或拖拽文件到这里</div>
<div class="sub">支持文档、图片、音频、视频 · 每个文件可设置不同格式</div>
</div>
<input type="file" id="file-input" multiple>

<div class="batch-settings">
<label>统一格式：</label>
<select id="batch-format"><option value="">分别设置</option></select>
<button onclick="applyBatchFormat()">应用到全部</button>
<button onclick="clearAll()" style="background:rgba(255,100,100,0.15);color:#f87171">清空列表</button>
</div>

<div class="file-list" id="file-list"></div>


<div class="progress-section" id="progress-section">
<div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>
<div class="progress-info"><span class="progress-percent" id="progress-percent">0%</span><span class="progress-eta" id="progress-eta"></span></div>
</div>
<div class="danmaku-area" id="danmaku-area"></div>
<button class="cancel-btn" id="cancel-btn">✕ 取消上传</button>
<button class="convert-btn" id="convert-all-btn" onclick="startBatchConvert()" disabled>开始批量转换</button>
</div>

<div style="text-align:center;margin-top:24px;padding-bottom:20px"><a href="https://ifdian.net/a/Fecilia" target="_blank" style="color:#888;text-decoration:none;font-size:0.85em;transition:color 0.3s" onmouseover="this.style.color=\"#ffb088\"" onmouseout="this.style.color=\"#888\"">❤️ 觉得好用？赞助作者 → 爱发电</a></div>

<script>
var rainOn=true,musicOn=true,musicPlaying=true,rainAudioCtx=null,rainGain=null,rainSource=null;
var musicAudio=document.getElementById("music-audio");
if(musicAudio)musicAudio.volume=0.4;
var files=[],formatMap={},_convTypes={};

fetch("/api/conversions").then(function(r){return r.json()}).then(function(data){
_convTypes=data;
var sel=document.getElementById("batch-format");
for(var k in data){var o=document.createElement("option");o.value=k;o.textContent=data[k].label;sel.appendChild(o)}
});

function startRain(){
if(rainAudioCtx)return;
try{
rainAudioCtx=new(window.AudioContext||window.webkitAudioContext)();
var sr=rainAudioCtx.sampleRate,len=sr*10;
var buf=rainAudioCtx.createBuffer(1,len,sr);
var data=buf.getChannelData(0);
for(var i=0;i<len;i++)data[i]=(Math.random()*2-1)*0.06;
rainSource=rainAudioCtx.createBufferSource();
rainSource.buffer=buf;rainSource.loop=true;
rainGain=rainAudioCtx.createGain();rainGain.gain.value=0.3;
rainSource.connect(rainGain);rainGain.connect(rainAudioCtx.destination);
rainSource.start();
}catch(e){}
}
function stopRain(){if(rainSource){try{rainSource.stop()}catch(e){}rainSource=null}}
function toggleRain(){
rainOn=!rainOn;var b=document.getElementById("sub-rain-btn");
if(rainOn){b.classList.add("active");b.textContent="🌧 雨声 开";startRain()}
else{b.classList.remove("active");b.textContent="🌧 雨声 关";stopRain()}
}
function toggleMusic(){
musicOn=!musicOn;var b=document.getElementById("sub-music-btn");
if(musicOn){b.classList.add("active");b.textContent="🎵 音乐 开";if(musicAudio)musicAudio.play().catch(function(){})}
else{b.classList.remove("active");b.textContent="🎵 音乐 关";if(musicAudio)musicAudio.pause()}
}
function toggleMusicPlay(){
musicPlaying=!musicPlaying;var b=document.getElementById("sub-play-btn");
if(musicPlaying){b.textContent="⏸";if(musicAudio&&musicOn)musicAudio.play().catch(function(){})}
else{b.textContent="▶";if(musicAudio)musicAudio.pause()}
}
function setMusicVolume(v){if(musicAudio)musicAudio.volume=v/100}
function switchTrack(t){if(musicAudio){var wp=!musicAudio.paused;musicAudio.src="/static/"+t+".mp3";if(wp||musicPlaying)musicAudio.play().catch(function(){})}}

function addFiles(nf){nf.forEach(function(f){files.push(f);formatMap[f.name]="";renderFileList()})}
function renderFileList(){
var list=document.getElementById("file-list");list.innerHTML="";
files.forEach(function(f,i){
var ext=f.name.split(".").pop().toLowerCase();
var opts='<option value="">自动检测</option>';
for(var k in _convTypes){if(_convTypes[k].in.indexOf("."+ext)>=0||_convTypes[k].in.indexOf("*")>=0)opts+='<option value="'+k+'">'+_convTypes[k].label+'</option>'}
var sn=f.name.replace(/'/g,"\\'");
list.innerHTML+='<div class="file-item"><span class="fname">'+f.name+'</span><span class="fsize">'+formatSize(f.size)+'</span><select onchange="formatMap[\''+sn+'\']=this.value">'+opts+'</select><button class="remove-btn" onclick="removeFile('+i+')">×</button><span class="status"></span></div>';
});
document.getElementById("convert-all-btn").disabled=files.length===0;
}
function applyBatchFormat(){var fmt=document.getElementById("batch-format").value;if(!fmt)return;files.forEach(function(f){formatMap[f.name]=fmt});document.querySelectorAll(".file-item select").forEach(function(s){s.value=fmt})}
function removeFile(i){files.splice(i,1);renderFileList()}
function clearAll(){files=[];renderFileList()}
function formatSize(b){if(b<1024)return b+" B";if(b<1048576)return (b/1024).toFixed(1)+" KB";if(b<1073741824)return (b/1048576).toFixed(1)+" MB";return (b/1073741824).toFixed(1)+" GB"}
var batchXHRs=[],batchPolling=[],batchCancelled=false;
var _lastBarPct=0;
function updateBar(p){var bar=document.getElementById("progress-bar");if(p>_lastBarPct){_lastBarPct=p;bar.style.width=p+"%"}}
var danmakuMessages=["马上就好了喵~ 🐱","正在努力转换中... ✨","喝杯茶等一下 ☕","快了快了~ 🏃💨","质量第一，稍安勿躁 💎","您的文件正在被精心处理 🎨","马上出炉啦 🔥","再等一下下就好~ 🌸","转换大师工作中... 🧙","好快！快了！⏩","文件在变魔法中 🪄","唔...这个文件有点东西 🤔"];
function spawnDanmaku(msg){var a=document.getElementById("danmaku-area"),e=document.createElement("div");e.className="danmaku-text";e.textContent=msg||danmakuMessages[Math.floor(Math.random()*danmakuMessages.length)];e.style.top=Math.floor(Math.random()*28)+"px";e.style.animationDuration=(6+Math.random()*5)+"s";a.appendChild(e);setTimeout(function(){e.remove()},12000)}
function formatETA(s){if(s<60)return Math.round(s)+"秒";if(s<3600)return Math.round(s/60)+"分"+Math.round(s%60)+"秒";return Math.round(s/3600)+"时"+Math.round((s%3600)/60)+"分"}
function formatSpeed(b){if(b<1024)return Math.round(b)+" B/s";if(b<1048576)return(b/1024).toFixed(1)+" KB/s";return(b/1048576).toFixed(1)+" MB/s"}

function startBatchConvert(){
if(!files.length)return;
var btn=document.getElementById("convert-all-btn");btn.disabled=true;btn.textContent="转换中...";
var ps=document.getElementById("progress-section");ps.classList.add("active");
_lastBarPct=0;updateBar(0);
document.getElementById("progress-percent").textContent="0%";
document.getElementById("progress-eta").textContent="开始处理 "+files.length+" 个文件...";
document.getElementById("cancel-btn").classList.add("active");
batchCancelled=false;batchXHRs=[];batchPolling=[];
spawnDanmaku("开始批量转换！共 "+files.length+" 个文件 🚀");

var done=0,total=files.length;
files.forEach(function(f,i){
var taskId="batch_"+Date.now()+"_"+i;
var fd=new FormData();fd.append("file",f);fd.append("type",formatMap[f.name]||"auto");fd.append("task_id",taskId);
var st=document.querySelectorAll(".file-item .status")[i];st.textContent="上传中";st.className="status processing";

var x=new XMLHttpRequest();batchXHRs.push(x);
x.open("POST","/convert");x.timeout=600000;
var uploadStart=Date.now();
x.upload.onprogress=function(e){if(!e.lengthComputable)return;var perFile=100/total;var fileUploadPct=(e.loaded/f.size)*perFile*0.5;var overallPct=Math.round((done/total)*100+fileUploadPct);updateBar(overallPct);document.getElementById("progress-percent").textContent=overallPct+"%";document.getElementById("progress-eta").textContent="上传第"+(done+1)+"/"+total+"个 · "+(done>0?done+"已完成 ":"")+formatSpeed(e.loaded/((Date.now()-uploadStart)/1000))};
x.upload.onloadend=function(){st.textContent="处理中";st.className="status processing";
  var poll=setInterval(function(){
    if(batchCancelled){clearInterval(poll);return}
    fetch("/convert/progress/"+taskId).then(function(r){return r.json()}).then(function(d){
      if(d.percent<0)return;
      if(d.percent>=100){clearInterval(poll);st.textContent="下载中";st.className="status processing"}
    }).catch(function(){});
  },500);
  batchPolling.push(poll);
};
x.onload=function(){
  done++;st.className="status done";
  if(x.status===200){try{var r=JSON.parse(x.responseText);if(r.ok){st.innerHTML='✅ <a href="'+r.download+'" download="'+r.name+'" style="display:inline-block;margin-left:8px;padding:6px 18px;border-radius:10px;background:linear-gradient(135deg,#22c55e,#10b981);color:#fff;font-weight:700;font-size:0.85em;text-decoration:none;cursor:pointer;transition:all 0.2s" onmouseover="this.style.transform=\'scale(1.05)\'" onmouseout="this.style.transform=\'scale(1)\'">下载</a>';spawnDanmaku("第"+done+"个完成！🎉")}else{st.textContent="失败";st.className="status error";spawnDanmaku("第"+done+"个转换失败 😢")}}catch(e){st.textContent="错误";st.className="status error"}}
  else{st.textContent="E"+x.status;st.className="status error"}
  var overall=Math.round((done/total)*100);updateBar(overall);
  document.getElementById("progress-percent").textContent=overall+"%";
  document.getElementById("progress-eta").textContent="已完成 "+done+"/"+total;
  if(done>=total){btn.disabled=false;btn.textContent="开始批量转换";updateBar(100);document.getElementById("progress-percent").textContent="100%";document.getElementById("progress-eta").textContent="✅ 完成！点击文件旁的绿色按钮下载";document.getElementById("cancel-btn").classList.remove("active");spawnDanmaku("全部完成，点击绿色按钮下载！🎉")}
};
x.onerror=function(){done++;st.textContent="网络错误";st.className="status error";if(done>=total){btn.disabled=false;btn.textContent="部分失败"}};
x.send(fd);
});
}

document.getElementById("cancel-btn").addEventListener("click",function(){
  batchCancelled=true;batchXHRs.forEach(function(x){try{x.abort()}catch(e){}});
  batchPolling.forEach(function(p){clearInterval(p)});
  var ps=document.getElementById("progress-section");ps.classList.remove("active");
  document.getElementById("progress-bar").style.width="0%";
  document.getElementById("progress-percent").textContent="0%";
  document.getElementById("progress-eta").textContent="";
  document.getElementById("cancel-btn").classList.remove("active");
  var btn=document.getElementById("convert-all-btn");
  btn.disabled=files.length===0;btn.textContent="开始批量转换";
  spawnDanmaku("已取消所有任务 ✋");
});

document.getElementById("file-input").addEventListener("change",function(e){addFiles(Array.from(e.target.files));this.value=""});
var dz=document.getElementById("drop-zone");
dz.addEventListener("dragover",function(e){e.preventDefault();dz.classList.add("drag-over")});
dz.addEventListener("dragleave",function(){dz.classList.remove("drag-over")});
dz.addEventListener("drop",function(e){e.preventDefault();dz.classList.remove("drag-over");addFiles(Array.from(e.dataTransfer.files))});


window.addEventListener("beforeunload", function(){
  if(musicAudio && musicAudio.src){
    var track = musicAudio.src.split("/").pop().replace(".mp3","");
    localStorage.setItem("ff_music_track", track);
    localStorage.setItem("ff_music_time", musicAudio.currentTime);
    localStorage.setItem("ff_music_playing", musicAudio.paused ? "0" : "1");
  }
});
(function(){
  var savedTrack = localStorage.getItem("ff_music_track");
  var savedTime = parseFloat(localStorage.getItem("ff_music_time")) || 0;
  var wasPlaying = localStorage.getItem("ff_music_playing") === "1";
  if(savedTrack && wasPlaying){
    
var _navigating = false;
document.addEventListener("click", function(e){
  var a = e.target.closest("a");
  if(a && a.href && !a.href.startsWith("javascript") && a.host === location.host && !a.href.includes("#")){
    e.preventDefault();
    if(_navigating) return;
    _navigating = true;
    if(musicAudio && !musicAudio.paused && musicOn){
      var vol = musicAudio.volume;
      var fade = setInterval(function(){
        vol = Math.max(0, vol - 0.05);
        musicAudio.volume = vol;
        if(vol <= 0){ clearInterval(fade); }
      }, 30);
      var track = musicAudio.src.split("/").pop().replace(".mp3","");
      localStorage.setItem("ff_music_track", track);
      localStorage.setItem("ff_music_time", musicAudio.currentTime + 0.3);
      localStorage.setItem("ff_music_playing", "1");
      setTimeout(function(){ window.location = a.href; }, 250);
    } else {
      localStorage.setItem("ff_music_playing", "0");
      window.location = a.href;
    }
  }
});
var _musicRestored = false;
function _restoreMusic(){
  if(_musicRestored) return;
  _musicRestored = true;
  var t = localStorage.getItem("ff_music_track");
  var s = parseFloat(localStorage.getItem("ff_music_time")) || 0;
  var p = localStorage.getItem("ff_music_playing") === "1";
  if(t && p && musicAudio && musicOn){
    musicAudio.src = "/static/" + t + ".mp3";
    musicAudio.currentTime = s;
    musicAudio.volume = 0;
    musicAudio.play().catch(function(){});
    var v = 0;
    var fi = setInterval(function(){
      v = Math.min(0.4, v + 0.04);
      musicAudio.volume = v;
      if(v >= 0.4){ clearInterval(fi); }
    }, 30);
  }
}
document.addEventListener("click", _restoreMusic, {once: true});
document.addEventListener("scroll", _restoreMusic, {once: true});
setTimeout(_restoreMusic, 3000);

document.addEventListener("DOMContentLoaded", function(){
      if(musicAudio && musicOn){
        musicAudio.src = "/static/" + savedTrack + ".mp3";
        musicAudio.currentTime = savedTime;
        musicAudio.play().catch(function(){});
      }
    });
  }
})();
// Auto-play music on first interaction
var _audioStarted = false;
function tryStartAudio(){
  if(_audioStarted) return;
  _audioStarted = true;
  if(rainOn && !rainAudioCtx) startRain();
  if(musicOn && musicPlaying){
    musicAudio.play().catch(function(){
      _audioStarted = false;
    });
  }
}
document.addEventListener("DOMContentLoaded", function(){
  tryStartAudio();
});
document.addEventListener("click", tryStartAudio, {once: true});
document.addEventListener("touchstart", tryStartAudio, {once: true});
document.addEventListener("scroll", tryStartAudio, {once: true});
document.addEventListener("mousemove", tryStartAudio, {once: true});

</script>
</body>
</html>
